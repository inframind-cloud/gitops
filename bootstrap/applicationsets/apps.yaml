apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:inframind-cloud/gitops.git
        revision: main
        directories:
          - path: apps/*/*
          - path: apps/_template/*
            exclude: true
  template:
    metadata:
      name: '{{index .path.segments 1}}-{{.path.basename}}'
      labels:
        inframind.cloud/type: app
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      source:
        repoURL: git@github.com:inframind-cloud/gitops.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 1}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
