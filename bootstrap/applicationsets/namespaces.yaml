apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: namespaces
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/inframind-cloud/gitops.git
        revision: main
        directories:
          - path: namespaces/*
  template:
    metadata:
      name: "ns-{{.path.basename}}"
      labels:
        inframind.cloud/type: namespace
    spec:
      project: platform
      source:
        repoURL: https://github.com/inframind-cloud/gitops.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
