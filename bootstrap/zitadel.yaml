apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel
  namespace: argocd
  labels:
    inframind.cloud/type: platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://charts.zitadel.com
    chart: zitadel
    targetRevision: 10.5.0
    helm:
      releaseName: zitadel
      valuesObject:
        replicaCount: 1
        postgresql:
          enabled: false
        zitadel:
          masterkeySecretName: zitadel-masterkey
          configSecretName: zitadel-admin-config
          configmapConfig:
            ExternalDomain: auth.inframind.cloud
            ExternalPort: 443
            ExternalSecure: true
            TLS:
              Enabled: false
        env:
          - name: ZITADEL_DATABASE_POSTGRES_DSN
            valueFrom:
              secretKeyRef:
                name: zitadel-db
                key: dsn
        ingress:
          enabled: true
          className: traefik
          annotations:
            external-dns.kubernetes.io/target: "104.225.216.99"
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: auth.inframind.cloud
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - auth.inframind.cloud
        login:
          enabled: true
          ingress:
            enabled: true
            className: traefik
            annotations:
              external-dns.kubernetes.io/target: "104.225.216.99"
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
            hosts:
              - host: auth.inframind.cloud
                paths:
                  - path: /ui/v2/login
                    pathType: Prefix
            tls:
              - hosts:
                  - auth.inframind.cloud
        initJob:
          backoffLimit: 10
          activeDeadlineSeconds: 600
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
