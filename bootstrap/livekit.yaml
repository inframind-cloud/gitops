apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: livekit
  namespace: argocd
  labels:
    inframind.cloud/type: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://helm.livekit.io
    chart: livekit-server
    targetRevision: 1.9.0
    helm:
      releaseName: livekit-server
      valuesObject:
        terminationGracePeriodSeconds: 600
        podHostNetwork: true
        loadBalancer:
          type: disable
        turnLoadbalancer:
          enable: false
        storeKeysInSecret:
          enabled: true
          existingSecret: livekit-keys
        resources:
          requests:
            cpu: "2"
            memory: 1Gi
        livekit:
          log_level: info
          key_file: keys.yaml
          prometheus_port: 6789
          rtc:
            tcp_port: 7881
            udp_port: 7882
            use_external_ip: true
            node_ip: "104.225.216.99"
          turn:
            enabled: true
            domain: turn.inframind.cloud
            tls_port: 5349
            udp_port: 443
            secretName: livekit-turn-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: livekit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
