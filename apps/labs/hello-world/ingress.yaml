apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  annotations:
    external-dns.kubernetes.io/target: "104.225.216.99"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hello-world.inframind.cloud
  rules:
    - host: hello-world.inframind.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  name: http
