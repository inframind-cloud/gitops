apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidespace-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidespace-ops
  template:
    metadata:
      labels:
        app: sidespace-ops
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: sidespace-ops
          image: ghcr.io/sidespace-chat/backoffice
          env:
            - name: VITE_API_BASE_URL
              value: https://api.sidespace.chat/api/v1
          ports:
            - name: http
              containerPort: 5174
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
