apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dopbase
  target:
    name: postgres-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |-
            {{- range (.runtime | fromJson).entries }}
            {{- if or (eq .key "POSTGRES_PASSWORD") (hasPrefix "BACKUP_R2_" .key) }}
            {{ .key }}: {{ .value | toJson }}
            {{- end }}
            {{- end }}
  data:
    - secretKey: runtime
      remoteRef:
        key: production
