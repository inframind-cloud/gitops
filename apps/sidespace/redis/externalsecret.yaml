apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dopbase
  target:
    name: redis-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |-
            {{- range (.runtime | fromJson).entries }}
            {{- if eq .key "REDIS_PASSWORD" }}
            {{ .key }}: {{ .value | toJson }}
            {{- end }}
            {{- end }}
  data:
    - secretKey: runtime
      remoteRef:
        key: production
