apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: dopbase
spec:
  provider:
    webhook:
      url: https://dopbase.inframind.cloud/api/v1/environments/env_732070/secrets/runtime
      method: GET
      headers:
        Accept: application/json
        Authorization: "Bearer {{ print .runner.token }}"
      result:
        jsonPath: $.data
      secrets:
        - name: runner
          secretRef:
            name: dopbase-runner
            key: token
