apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dopbase
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {{- $user := "" }}{{- $token := "" }}
          {{- range (.runtime | fromJson).entries }}
          {{- if eq .key "GHCR_PULL_USER" }}{{ $user = .value }}{{ end }}
          {{- if eq .key "GHCR_PULL_TOKEN" }}{{ $token = .value }}{{ end }}
          {{- end }}
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" $user $token | b64enc }}"}}}
  data:
    - secretKey: runtime
      remoteRef:
        key: production
