apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidespace-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sidespace-api
  template:
    metadata:
      labels:
        app: sidespace-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 65532
      containers:
        - name: sidespace-api
          image: ghcr.io/sidespace-chat/sidespace-api
          envFrom:
            - secretRef:
                name: sidespace-api-env
          env:
            - name: SIDESPACE_PORT
              value: "8080"
            - name: SIDESPACE_AUTO_MIGRATE
              value: "true"
            - name: SIDESPACE_STORAGE_DRIVER
              value: local
            - name: SIDESPACE_STORAGE_LOCAL_DIR
              value: /data/uploads
            - name: SIDESPACE_STORAGE_PUBLIC_BASE_URL
              value: https://api.sidespace.chat/uploads
            - name: GOMEMLIMIT
              value: 900MiB
            # A origem só aceita 80/443 da Cloudflare (firewall do host).
            - name: SIDESPACE_PROXY_HEADER
              value: CF-Connecting-IP
            - name: SIDESPACE_TRUSTED_PROXIES
              value: 10.42.0.0/16
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: sidespace-api-uploads
