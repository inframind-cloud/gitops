apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: livekit-turn
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: livekit-turn-tls
  issuerRef:
    name: cloudflare-dns
    kind: ClusterIssuer
  dnsNames:
    - turn.inframind.cloud
