apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livekit
  annotations:
    external-dns.kubernetes.io/target: "104.225.216.99"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - livekit.inframind.cloud
  rules:
    - host: livekit.inframind.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit-server
                port:
                  name: http
