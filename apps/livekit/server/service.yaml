apiVersion: v1
kind: Service
metadata:
  name: livekit-server
spec:
  selector:
    app.kubernetes.io/name: livekit-server
    app.kubernetes.io/instance: livekit-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: rtc-tcp
      port: 7881
      targetPort: rtc-tcp
      protocol: TCP
    - name: rtc-udp
      port: 7882
      targetPort: rtc-udp
      protocol: UDP
    - name: metrics
      port: 6789
      targetPort: metrics
      protocol: TCP
