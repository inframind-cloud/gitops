apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-server
  labels:
    app.kubernetes.io/name: livekit-server
    app.kubernetes.io/instance: livekit-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-server
      app.kubernetes.io/instance: livekit-server
  # hostNetwork + hostPorts: o pod novo só sobe depois que o antigo libera as portas.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit-server
        app.kubernetes.io/instance: livekit-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 600
      containers:
        - name: livekit-server
          image: livekit/livekit-server:v1.13.11
          args: ["--disable-strict-config"]
          env:
            - name: LIVEKIT_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: livekit-server
                  key: config.yaml
            - name: LIVEKIT_TURN_CERT
              value: /etc/lkcert/tls.crt
            - name: LIVEKIT_TURN_KEY
              value: /etc/lkcert/tls.key
          ports:
            - name: http
              containerPort: 7880
              protocol: TCP
            - name: rtc-udp
              containerPort: 7882
              hostPort: 7882
              protocol: UDP
            - name: rtc-tcp
              containerPort: 7881
              hostPort: 7881
              protocol: TCP
            - name: metrics
              containerPort: 6789
              hostPort: 6789
              protocol: TCP
            - name: turn-tls
              containerPort: 5349
              hostPort: 5349
              protocol: TCP
            - name: turn-udp
              containerPort: 443
              hostPort: 443
              protocol: UDP
          # Restart derruba todas as chamadas: sob carga o / passa de 1 s, então só
          # reinicia depois de ~1 min sem resposta.
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: keys
              mountPath: keys.yaml
              subPath: keys.yaml
            - name: turn-cert
              mountPath: /etc/lkcert
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: livekit-keys
            defaultMode: 0600
        - name: turn-cert
          secret:
            secretName: livekit-turn-tls
