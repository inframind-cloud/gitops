apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: livekit-keys
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler
    kind: ClusterSecretStore
  target:
    name: livekit-keys
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: keys.yaml
      remoteRef:
        key: LIVEKIT_KEYS
